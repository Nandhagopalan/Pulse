[project]
name = "pulse-pipeline"
version = "0.1.0"
description = "NSE → R2 Parquet lake → DuckDB analytics → Supabase pipeline for the Pulse terminal"
readme = "pipeline/README.md"
# 3.12 rather than whatever the machine ships: uv fetches its own interpreter,
# so the pipeline does not inherit macOS's end-of-life system Python.
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "numpy>=1.26",
    "boto3>=1.34",
    "requests>=2.31",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
# Checks only — the nightly job installs the runtime deps above and nothing else.
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "boto3-stubs[s3]>=1.34",
    "types-requests>=2.31",
]

[tool.uv]
# The pipeline is an application run via `uv run python -m pipeline`, not a
# library to be built and installed.
package = false

[tool.ruff]
target-version = "py312"
line-length = 110          # the existing code sits well under this; it is not a reformat
src = ["pipeline"]

[tool.ruff.lint]
# BLE is the point of this block: the code already carries `# noqa: BLE001` on
# every deliberate broad catch, but no linter was installed to honour them, so
# an *undeliberate* one would have gone unnoticed.
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # import ordering
    "B",           # bugbear
    "BLE",         # blind except
    "C4",          # comprehensions
    "SIM",         # simplify
    "RUF",
]
# UP (pyupgrade) is deliberately off: it would rewrite ~91 typing.Optional/List
# annotations to 3.12 syntax in one sweep, which is a separate decision from
# turning linting on.
ignore = [
    "E501",        # long lines are almost all prose in docstrings
]

[tool.mypy]
python_version = "3.12"
files = ["pipeline"]
ignore_missing_imports = true   # duckdb and pyarrow ship no complete stubs
warn_unused_ignores = true
warn_redundant_casts = true
# Not strict: the pipeline passes untyped DuckDB rows around by design, and
# demanding annotations on every local would be noise, not safety.
check_untyped_defs = true
