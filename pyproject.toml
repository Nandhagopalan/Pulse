[project]
name = "pulse-pipeline"
version = "0.1.0"
description = "NSE → R2 Parquet lake → DuckDB analytics → Supabase pipeline for the Pulse terminal"
readme = "pipeline/README.md"
# 3.12 rather than whatever the machine ships: uv fetches its own interpreter,
# so the pipeline does not inherit macOS's end-of-life system Python.
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "numpy>=1.26",
    "boto3>=1.34",
    "requests>=2.31",
    "psycopg[binary]>=3.1",
]

[tool.uv]
# The pipeline is an application run via `uv run python -m pipeline`, not a
# library to be built and installed.
package = false
